version: '3.8'

services:
  budget-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SQLITE_DB_PATH=/app/data/budget.db
    volumes:
      - budget-data:/app/data
    restart: unless-stopped

volumes:
  budget-data:
